name: dreamify
description: "AI-powered image generation and editing app with Gemini 2.5 Flash Image API"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3+1
  retrofit: ^4.1.0
  json_annotation: ^4.9.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # Image Processing
  image: ^4.2.0

  # Monetization
  in_app_purchase: ^3.2.0
  in_app_purchase_storekit: ^0.3.17+3
  in_app_purchase_android: ^0.3.6+3

  # Analytics & Monitoring (Firebase)
  firebase_core: ^3.1.1
  firebase_analytics: ^11.1.0
  # firebase_crashlytics: ^4.0.2  # Temporarily disabled for build
  firebase_remote_config: ^5.0.2

  # Media Handling
  image_picker: ^1.1.2
  camera: ^0.11.0+1
  photo_manager: ^3.2.1
  share_plus: ^9.0.0
  permission_handler: ^11.3.1

  # UI Components
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  lottie: ^3.1.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  logger: ^2.3.0
  connectivity_plus: ^6.0.3
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Linting & Analysis
  flutter_lints: ^5.0.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

  # Code Generation
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  retrofit_generator: ^8.1.0
  hive_generator: ^2.0.1

  # Testing
  mockito: ^5.4.4
  mocktail: ^1.0.3
  golden_toolkit: ^0.15.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/templates/

  # fonts:
  #   - family: Rubik
  #     fonts:
  #       - asset: assets/fonts/Rubik-Regular.ttf
  #       - asset: assets/fonts/Rubik-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Rubik-Bold.ttf
  #         weight: 700
